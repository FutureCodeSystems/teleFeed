name: Multi-Platform Build

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        goos: [linux, windows, darwin]
        goarch: [amd64]
        exclude:
          - os: ubuntu-latest
            goos: windows
          - os: windows-latest
            goos: linux
          - os: macos-latest
            goos: windows
          - os: macos-latest
            goos: linux
            
    runs-on: ${{ matrix.os }}
    
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version: '1.23'
        
    - name: Build
      run: |
        go env -w GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }}
        if [ "${{ matrix.goos }}" = "windows" ]; then
          go build -o myapp-${{ matrix.goos }}-${{ matrix.goarch }}.exe
        else
          go build -o myapp-${{ matrix.goos }}-${{ matrix.goarch }}
        fi
      shell: bash
      
    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: myapp-${{ matrix.goos }}-${{ matrix.goarch }}
        path: myapp-*
